[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tropcurves"
version = "0.1.0"
description = "Combinatorial types of rational plane tropical curves"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tropcurves"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tropical Curves Visualiser</title>
<!-- Bump ?v= on each deploy that changes styles.css. app.js does not need a
     manual bump: it is loaded with a time-based token at the end of <body>. -->
<link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
<header id="topbar">
  <h1>Tropical Curves</h1>
  <div class="actions">
    <button id="btn-new">New</button>
    <button id="btn-settings" title="Display settings: colors, labels, background">🎨 Display</button>
    <button id="btn-mult" title="Refined multiplicities, and balanced splits of a set of curves">Multiplicity</button>
    <button id="btn-save" title="Save the workspace, or a chosen subset of it, as JSON">Export…</button>
    <button id="btn-load">Import</button>
    <span id="autosave" class="muted" title="Saved in this browser"></span>
    <span id="app-version" class="muted" title="Loaded app version (blank means a stale cached app.js)"></span>
  </div>
</header>

<div id="boot" class="boot">
  <div class="spinner"></div>
  <div id="boot-msg">Loading Python runtime…</div>
</div>

<main id="app" hidden>
  <section id="types">
    <div class="section-head">
      <h2>Types</h2>
    </div>
    <ul id="type-list"></ul>
  </section>

  <section id="views">
    <div class="view">
      <div class="view-head">
        <h2>Curve <span id="curve-name" class="muted"></span></h2>
        <button id="copy-curve" class="small" title="Copy as a PNG with a transparent background">Copy</button>
      </div>
      <div id="curve-status" class="status"></div>
      <svg id="curve-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="view">
      <details id="sub-details">
        <summary><h2>Dual subdivision</h2></summary>
        <div class="view-head">
          <div id="sub-note" class="muted"></div>
          <button id="copy-sub" class="small" title="Copy as a PNG including the background">Copy</button>
        </div>
        <svg id="sub-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
        <details class="dbg" id="sub-debug"></details>
      </details>
    </div>
  </section>

  <section id="controls">
    <div class="section-head"><h2>Edit</h2></div>
    <div id="controls-body">
      <p class="muted">Select a type to edit it.</p>
    </div>
  </section>
</main>

<!-- modal host -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost">Close</button>
    </div>
  </div>
</div>

<input id="file-input" type="file" accept="application/json" hidden />
<a id="download-anchor" hidden></a>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
// Load app.js with a time-based freshness token rather than a fixed ?v=N.
// A fixed token lives inside this file, so a CACHED copy of this page keeps
// requesting the old app.js forever and never learns a new version exists.
// Bucketing by the minute keeps normal reloads cache-friendly while
// guaranteeing the script can never be more than a minute stale.
(function () {
  var s = document.createElement("script");
  s.src = "app.js?t=" + Math.floor(Date.now() / 60000);
  s.onerror = function () {
    var m = document.getElementById("boot-msg");
    if (m) m.textContent = "Failed to load app.js";
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>

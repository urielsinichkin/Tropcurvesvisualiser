<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tropical Curves Visualiser</title>
<!-- Bump ?v= on each deploy that changes styles.css. app.js does not need a
     manual bump: it is loaded with a time-based token at the end of <body>. -->
<link rel="stylesheet" href="styles.css?v=33" />
</head>
<body>
<header id="topbar">
  <h1>Tropical Curves</h1>
  <!-- On a narrow screen the actions collapse behind this button; wide screens
       show them in a row and hide the button (CSS only, same markup). -->
  <button id="btn-menu" aria-label="Menu" aria-controls="menu" aria-expanded="false">☰</button>
  <div class="actions" id="menu">
    <button id="btn-new">New</button>
    <button id="btn-settings" title="Display settings: colors, labels, background">🎨 Display</button>
    <button id="btn-mult" title="Refined multiplicities, and balanced splits of a set of curves">Multiplicity</button>
    <button id="btn-save" title="Save the workspace, or a chosen subset of it, as JSON">Export…</button>
    <button id="btn-load">Import</button>
    <button id="btn-drive" title="Save the library to Google Drive, or open one from there">☁ Drive…</button>
    <span class="status-line">
      <span id="autosave" class="muted" title="Saved in this browser"></span>
      <span id="app-version" class="muted" title="Loaded app version (blank means a stale cached app.js)"></span>
    </span>
  </div>
</header>

<div id="boot" class="boot">
  <div class="spinner"></div>
  <div id="boot-msg">Loading Python runtime…</div>
</div>

<main id="app" hidden>
  <section id="types">
    <div class="section-head">
      <h2>Types</h2>
      <span id="types-tools" hidden><button id="types-fold-all" class="small">Collapse all</button></span>
    </div>
    <ul id="type-list"></ul>
  </section>

  <div class="splitter" id="split-types" role="separator" aria-orientation="vertical"
       aria-label="Resize the types panel" title="Drag to resize; double-click to reset" tabindex="0"></div>

  <section id="views">
    <div class="view">
      <div class="view-head">
        <h2>Curve <span id="curve-name" class="muted"></span></h2>
        <span class="row" style="gap:6px">
          <span class="zoom-tools" id="zoom-tools" title="Zoom: mouse wheel or pinch; drag to move around">
            <span class="zoom-level" id="zoom-level"></span>
            <button id="zoom-out" class="small zoom-step" aria-label="Zoom out">−</button>
            <button id="zoom-in" class="small zoom-step" aria-label="Zoom in">+</button>
            <button id="zoom-fit" class="small" title="Show the whole curve" hidden>Fit</button>
          </span>
          <button id="paint-curve" class="small" title="Color edges and markings by clicking them on the curve">🖌 Paint</button>
          <button id="copy-curve" class="small" title="Copy as a PNG with a transparent background">Copy</button>
        </span>
      </div>
      <div id="paint-bar" class="paint-bar" hidden>
        <span class="paint-chip" id="paint-chip"></span>
        <span id="paint-hint"></span>
        <span class="row" style="gap:6px;margin-left:auto">
          <button id="paint-change" class="small">Change color</button>
          <button id="paint-cancel" class="small">Cancel</button>
        </span>
      </div>
      <div id="curve-status" class="status"></div>
      <svg id="curve-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="view">
      <details id="sub-details">
        <summary><h2>Dual subdivision</h2></summary>
        <div class="view-head">
          <div id="sub-note" class="muted"></div>
          <button id="copy-sub" class="small" title="Copy as a PNG including the background">Copy</button>
        </div>
        <svg id="sub-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
        <details class="dbg" id="sub-debug"></details>
      </details>
    </div>
  </section>

  <div class="splitter" id="split-controls" role="separator" aria-orientation="vertical"
       aria-label="Resize the edit panel" title="Drag to resize; double-click to reset" tabindex="0"></div>

  <section id="controls">
    <div class="section-head"><h2>Edit</h2>
      <button id="panel-layout" class="small" title="Choose the order of this panel's parts and which are shown">⚙ Layout</button></div>
    <div id="controls-body">
      <p class="muted">Select a type to edit it.</p>
    </div>
  </section>
</main>

<!-- modal host -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost">Close</button>
    </div>
  </div>
</div>

<input id="file-input" type="file" accept="application/json" hidden />
<a id="download-anchor" hidden></a>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
// Load app.js with a time-based freshness token rather than a fixed ?v=N.
// A fixed token lives inside this file, so a CACHED copy of this page keeps
// requesting the old app.js forever and never learns a new version exists.
// Bucketing by the minute keeps normal reloads cache-friendly while
// guaranteeing the script can never be more than a minute stale.
(function () {
  var s = document.createElement("script");
  s.src = "app.js?t=" + Math.floor(Date.now() / 60000);
  s.onerror = function () {
    var m = document.getElementById("boot-msg");
    if (m) m.textContent = "Failed to load app.js";
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>

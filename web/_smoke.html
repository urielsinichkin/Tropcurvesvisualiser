<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head><body>

<script>
window.__lastCells=null;
const R={id:"T1",name:"c",status:"ok",curve:{vertices:[{id:"v0",x:0,y:0}],edges:[{id:"a",name:"a",color:"#333",kind:"end",weight:1,from:[0,0],to:[-1,0]},{id:"b",name:"b",color:"#333",kind:"end",weight:1,from:[0,0],to:[0,-1]},{id:"d",name:"d",color:"#333",kind:"end",weight:1,from:[0,0],to:[1,1]}],markings:[]},newton:[[0,0],[1,0],[0,1]],subdivision:{cells:[[[0,0],[1,0],[0,1]]]}};
let N=[{id:"T1",name:"c",parent_id:null,children:[],follow_parent:true,status:"ok",num_ends:3,num_markings:0,num_bounded:0,valences:{v0:3}}];
function be(n,a){ if(n==="add_from_subdivision"){window.__lastCells=a[0];return N[0];} switch(n){case"list_nodes":return N;case"add_preset":return N[0];case"render":return R;case"save":return"{}";case"load":return null;default:return N[0];}}
window.loadPyodide=async()=>({FS:{mkdir(){},writeFile(){}},runPython(){},globals:{get(){return (n,a)=>JSON.stringify(be(n,JSON.parse(a)));}}});
window.fetch=async()=>({ok:true,text:async()=>""});
</script>

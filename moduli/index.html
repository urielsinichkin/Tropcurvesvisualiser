<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Moduli map — Tropical Curves</title>
<!-- the main app's stylesheet: keep ?v= equal to web/index.html's -->
<link rel="stylesheet" href="../web/styles.css?v=52" />
</head>
<body class="moduli-page">
<header id="topbar">
  <h1>Moduli map</h1>
  <button id="btn-menu" aria-label="Menu" aria-controls="menu" aria-expanded="false">☰</button>
  <div class="actions" id="menu">
    <button id="mm-from-app" title="Load the library you are working on in the main app (it saves itself in this browser)">Main app's library</button>
    <button id="mm-import" title="Load a library file, or a saved session">Import…</button>
    <button id="mm-save" title="Save the library, the choices, the points and the point of M0,5 as one file">Save session</button>
    <button id="mm-send" title="Send this library, with any changes made here, to the main app; it offers to add it">Send to main app</button>
    <a class="btn-link" href="../web/index.html" title="Back to the main app">Main app</a>
    <button id="btn-help" title="What the buttons do, and the full guide">? Help</button>
    <span class="status-line">
      <span id="mm-saved" class="muted" title="The session is kept in this browser"></span>
      <span id="app-version" class="muted"></span>
    </span>
  </div>
</header>

<div id="boot" class="boot">
  <div class="spinner"></div>
  <div id="boot-msg">Loading Python runtime…</div>
</div>

<main id="mm" hidden>
  <section id="mm-setup">
    <div class="section-head"><h2>Setup</h2></div>
    <div id="mm-setup-body"></div>
  </section>

  <section id="mm-space">
    <div class="view-head">
      <h2>Chart of M₀,₅ <span id="mm-chart-note" class="muted"></span></h2>
      <span class="row" style="gap:6px">
        <button id="mm-reset-m" class="small" title="Put the point of M0,5 back where it started">Reset point</button>
        <button id="mm-range-out" class="small" title="Show more of M0,5 (larger lengths)" aria-label="Zoom out">−</button>
        <button id="mm-range-in" class="small" title="Show less of M0,5 (smaller lengths)" aria-label="Zoom in">+</button>
        <button id="mm-copy-chart" class="small" title="Copy as a PNG">Copy</button>
        <button id="mm-svg-chart" class="small" title="Download as SVG">SVG</button>
      </span>
    </div>
    <div class="mm-bar">
      <label class="check"><input type="checkbox" id="mm-snap" checked> Snap to walls</label>
      <span id="mm-where" class="muted"></span>
    </div>
    <svg id="mm-chart" class="mm-drag" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="mm-chart-legend" class="sub-legend" hidden></div>

    <div class="view-head mm-sub">
      <h2>Overview <span class="muted">(Petersen graph)</span></h2>
      <span class="row" style="gap:6px">
        <button id="mm-copy-overview" class="small" title="Copy as a PNG">Copy</button>
        <button id="mm-svg-overview" class="small" title="Download as SVG">SVG</button>
      </span>
    </div>
    <div class="mm-bar">
      <label for="mm-size">Size a + b</label>
      <input type="range" id="mm-size" min="0" max="1000" step="1" value="500">
      <span id="mm-size-val" class="muted"></span>
    </div>
    <svg id="mm-overview" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="mm-legend" class="sub-legend"></div>

    <details id="mm-path">
      <summary><h2>Animate a path</h2></summary>
      <div class="mm-bar">
        <button id="mm-path-from" class="small" title="Start the path at the current point">From here</button>
        <button id="mm-path-to" class="small" title="End the path at the current point">To here</button>
        <button id="mm-path-play" class="small" disabled>▶ Play</button>
        <button id="mm-path-clear" class="small ghost" disabled>Clear</button>
      </div>
      <input type="range" id="mm-path-t" min="0" max="1000" step="1" value="0" disabled aria-label="Position along the path">
      <ol id="mm-path-log" class="mm-log"></ol>
    </details>
  </section>

  <section id="mm-curves">
    <div class="view-head">
      <h2>Curve <span id="mm-curve-name" class="muted"></span></h2>
      <span class="row" style="gap:6px">
        <button id="mm-reset-points" class="small" title="Put the points in the plane back where they started">Reset points</button>
        <button id="mm-copy-figure" class="small" title="Copy as a PNG with a transparent background">Copy</button>
        <button id="mm-svg-figure" class="small" title="Download as SVG">SVG</button>
      </span>
    </div>
    <div id="mm-figure-note" class="status"></div>
    <svg id="mm-figure" class="mm-drag" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="view-head mm-sub"><h2>Preimage <span id="mm-count" class="muted"></span></h2></div>
    <div id="mm-notes" class="muted"></div>
    <div id="mm-gallery" class="mm-gallery"></div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost">Close</button>
    </div>
  </div>
</div>
<input id="mm-file" type="file" accept="application/json,.json" hidden />
<a id="download-anchor" hidden></a>

<script>
// app.js defines the drawing, export and help code, and starts nothing here
window.TROP_LIBRARY_MODE = true;
window.TROP_HELP_BASE = "../web/";
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
// As in web/index.html. Load the scripts fresh but cheaply: each is fetched with cache "no-cache",
// so the browser revalidates it (its ETag) on every load. A changed file
// arrives at once -- a refresh always shows the latest version, even from a
// cached copy of this page -- and an unchanged one costs a 304 with no body
// instead of a download. They run in order (NAMES), the help text first:
// app.js reads it. Where fetch cannot be used (a file: URL), plain script
// tags with a per-minute token do the same job less cheaply.
(function () {
  var NAMES = ["../web/help-tips.js", "../web/app.js", "moduli.js"];
  var failed = function (name) {
    var m = document.getElementById("boot-msg");
    if (m) m.textContent = "Failed to load " + name;
  };
  var tags = function () {
    var t = Math.floor(Date.now() / 60000);
    NAMES.forEach(function (name) {
      var s = document.createElement("script");
      s.src = name + "?t=" + t;
      s.async = false;
      s.onerror = function () { failed(name); };
      document.body.appendChild(s);
    });
  };
  if (!window.fetch || location.protocol === "file:") { tags(); return; }
  Promise.all(NAMES.map(function (name) {
    return fetch(name, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(name + ": " + r.status);
      return r.text();
    });
  })).then(function (texts) {
    texts.forEach(function (text, i) {
      var s = document.createElement("script");
      // named, so errors and the debugger point at the file
      s.textContent = text + "\n//# sourceURL=" + new URL(NAMES[i], location.href).href;
      document.body.appendChild(s);
    });
  }).catch(function () { tags(); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Moduli map — Tropical Curves</title>
<!-- the main app's stylesheet: keep ?v= equal to web/index.html's -->
<link rel="stylesheet" href="../web/styles.css?v=55" />
</head>
<body class="moduli-page">
<header id="topbar">
  <h1>Moduli map</h1>
  <button id="btn-menu" aria-label="Menu" aria-controls="menu" aria-expanded="false">☰</button>
  <div class="actions" id="menu">
    <button id="mw-restart" title="Forget this type and start again with a new one">↺ New type</button>
    <a class="btn-link" href="../web/index.html" title="The main app">Main app</a>
    <button id="btn-help" title="What this page does, and the full guide">? Help</button>
    <span class="status-line">
      <span id="mw-saved" class="muted" title="Kept in this browser"></span>
      <span id="app-version" class="muted"></span>
    </span>
  </div>
</header>

<div id="boot" class="boot">
  <div class="spinner"></div>
  <div id="boot-msg">Loading Python runtime…</div>
</div>

<main id="mw" hidden>
  <!-- step 1: the type, its markings, the legs and the evaluated markings -->
  <section id="mw-setup">
    <div class="section-head"><h2>1. The type</h2></div>
    <div class="mw-bar">
      <button id="mw-draw" class="primary">Draw a subdivision…</button>
      <details id="mw-paste">
        <summary>or paste as text</summary>
        <p class="muted mw-small">One cell per line, each a list of lattice points, e.g. <code>[[0,0],[1,0],[0,1]]</code>.</p>
        <textarea id="mw-paste-text" rows="4" class="dbg-text" placeholder="[[0,0],[1,0],[0,1]]"></textarea>
        <div><button id="mw-paste-go" class="small">Create</button></div>
      </details>
    </div>
    <div id="mw-type" hidden>
      <div class="mw-tabs" role="tablist">
        <button data-mode="markings" class="small">Markings</button>
        <button data-mode="move" class="small">Move</button>
        <button data-mode="legs" class="small">Legs of M₀,₅</button>
        <button data-mode="points" class="small">Evaluated</button>
        <button data-mode="same" class="small">Same point</button>
        <button data-mode="slopes" class="small">Slopes</button>
      </div>
      <p id="mw-hint" class="muted mw-small"></p>
      <svg id="mw-type-svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="mw-pick-status" class="pick-status"></div>
      <div id="mw-slope" class="mw-slope" hidden></div>
      <div class="sub-legend">
        <span><span class="mm-key mm-key-leg"></span>leg of M₀,₅</span>
        <span><span class="mm-key mm-key-ev"></span>evaluated (a fixed point in ℝ²)</span>
        <span><span class="mm-key mm-key-same"></span>one point with another marking</span>
      </div>
      <div id="mw-check" class="status"></div>
      <div class="mw-bar"><button id="mw-start" class="primary" disabled>Start →</button></div>
    </div>
  </section>

  <!-- step 2: the curve and its cell of M_0,5 -->
  <section id="mw-curve-sec" hidden>
    <div class="view-head">
      <h2>Curve <span id="mw-curve-name" class="muted"></span></h2>
      <span class="row" style="gap:6px">
        <button id="mw-back" class="small" title="Back to the type, its markings and choices">← Type</button>
        <button id="mw-copy-curve" class="small" title="Copy as a PNG">Copy</button>
      </span>
    </div>
    <svg id="mw-curve" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="mw-paths" class="sub-legend"></div>
  </section>

  <section id="mw-cell-sec" hidden>
    <div class="view-head">
      <h2>Cell of M₀,₅ <span id="mw-cell-kind" class="muted"></span></h2>
      <span class="row" style="gap:6px">
        <button id="mw-copy-cell" class="small" title="Copy as a PNG">Copy</button>
      </span>
    </div>
    <div id="mw-where" class="muted mw-small"></div>
    <svg id="mw-cell" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="mw-wall" hidden>
      <p id="mw-wall-text" class="mw-small"></p>
      <div id="mw-regens" class="mw-regens"></div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost">Close</button>
    </div>
  </div>
</div>
<a id="download-anchor" hidden></a>

<script>
// app.js defines the drawing, the subdivision editor, export and help, and
// starts nothing here
window.TROP_LIBRARY_MODE = true;
window.TROP_HELP_BASE = "../web/";
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
// As in web/index.html. Load the scripts fresh but cheaply: each is fetched
// with cache "no-cache", so the browser revalidates it (its ETag) on every
// load. A changed file arrives at once -- a refresh always shows the latest
// version, even from a cached copy of this page -- and an unchanged one costs
// a 304 with no body instead of a download. They run in order (NAMES), the
// help text first: app.js reads it. Where fetch cannot be used (a file: URL),
// plain script tags with a per-minute token do the same job less cheaply.
(function () {
  var NAMES = ["../web/help-tips.js", "../web/app.js", "moduli.js"];
  var failed = function (name) {
    var m = document.getElementById("boot-msg");
    if (m) m.textContent = "Failed to load " + name;
  };
  var tags = function () {
    var t = Math.floor(Date.now() / 60000);
    NAMES.forEach(function (name) {
      var s = document.createElement("script");
      s.src = name + "?t=" + t;
      s.async = false;
      s.onerror = function () { failed(name); };
      document.body.appendChild(s);
    });
  };
  if (!window.fetch || location.protocol === "file:") { tags(); return; }
  Promise.all(NAMES.map(function (name) {
    return fetch(name, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(name + ": " + r.status);
      return r.text();
    });
  })).then(function (texts) {
    texts.forEach(function (text, i) {
      var s = document.createElement("script");
      // named, so errors and the debugger point at the file
      s.textContent = text + "\n//# sourceURL=" + new URL(NAMES[i], location.href).href;
      document.body.appendChild(s);
    });
  }).catch(function () { tags(); });
})();
</script>
</body>
</html>
